name: Kapture

options:
  bundleIdPrefix: com.eriklarson
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  KaptureKit:
    path: .

targets:
  Kapture:
    type: application
    platform: macOS
    sources:
      - path: App/Kapture
      - path: App/Resources/Assets.xcassets
    dependencies:
      - package: KaptureKit
        product: KaptureKit
    settings:
      base:
        PRODUCT_NAME: Kapture
        PRODUCT_BUNDLE_IDENTIFIER: com.eriklarson.kapture
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/Resources/Kapture.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "14.0"
